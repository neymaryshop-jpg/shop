services:
  # Redis - кэширование и сессии
  redis:
    image: redis:7-alpine
    container_name: neymaryshop_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neymaryshop

  # PostgreSQL - основная база данных
  postgres:
    image: postgres:15-alpine
    container_name: neymaryshop_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: neymaryshop
      POSTGRES_USER: neymary
      POSTGRES_PASSWORD: neymary123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neymary"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - neymaryshop

  # Backend - API сервер (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neymaryshop_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgresql://neymary:neymary123@postgres:5432/neymaryshop
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-secret123}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refreshsecret123}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002/api}
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3003
    ports:
      - "3002:3002"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./logs/backend:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neymaryshop

  # Frontend - основной сайт (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neymaryshop_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neymaryshop

  # Admin - панель администратора (Next.js)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: neymaryshop_admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3002/api}
    ports:
      - "3003:3003"
    depends_on:
      - backend
    command: ["node", "server.js"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neymaryshop

  # Telegram Bot - бот для уведомлений и продаж
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: neymaryshop_telegram_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      DATABASE_URL: postgresql://neymary:neymary123@postgres:5432/neymaryshop
      REDIS_URL: redis://redis:6379
      BACKEND_URL: http://backend:3002
      ADMIN_IDS: ${ADMIN_IDS:-1661627681}
      TON_NETWORK: ${TON_NETWORK:-testnet}
      TON_WALLET_ADDRESS: ${TON_WALLET_ADDRESS}
      TON_WALLET_MNEMONIC: ${TON_WALLET_MNEMONIC}
    depends_on:
      - backend
      - postgres
      - redis
    volumes:
      - ./logs/telegram-bot:/app/logs
    networks:
      - neymaryshop

  # Nginx - reverse proxy (опционально, для production)
  nginx:
    image: nginx:alpine
    container_name: neymaryshop_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - admin
    networks:
      - neymaryshop
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  neymaryshop:
    driver: bridge
